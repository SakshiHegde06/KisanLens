spring:
  application:
    name: kisanlens-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

kisanlens:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-something-long-and-random-in-production}
    expiration-ms: 86400000 # 24 hours
  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
  weather:
    api-key: ${WEATHER_API_KEY:}
    base-url: https://api.openweathermap.org/data/2.5
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
